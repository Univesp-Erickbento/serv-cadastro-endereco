name: CI/CD Pipeline

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout do código
        uses: actions/checkout@v3

      - name: ☕ Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🧪 Build com Maven
        run: mvn clean install -DskipTests

      - name: 📦 Obter versão do projeto (pom.xml)
        id: project_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🐳 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build da imagem Docker
        run: docker build -t torresbento/tbmt-cadastro-de-endereco:${{ steps.project_version.outputs.version }} .

      - name: 📤 Push para Docker Hub
        run: docker push torresbento/tbmt-cadastro-de-endereco:${{ steps.project_version.outputs.version }}

      - name: 🚀 Deploy no servidor via SSH
        if: ${{ secrets.REMOTE_HOST != null && secrets.REMOTE_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "⛔ Parando container antigo (se existir)..."
            docker stop cadastro-endereco || true
            
            echo "🗑️ Removendo container antigo (se existir)..."
            docker rm cadastro-endereco || true
            
            echo "🧹 Removendo imagem antiga (se existir)..."
            docker image prune -a -f --filter "label=project=cadastro-endereco" || true
            
            echo "⬇️ Baixando nova imagem..."
            docker pull torresbento/tbmt-cadastro-de-endereco:${{ steps.project_version.outputs.version }}
            
            echo "🏃 Subindo novo container..."
            docker run -d --name cadastro-endereco \
              --label project=cadastro-endereco \
              -p 9092:9092 \
              torresbento/tbmt-cadastro-de-endereco:${{ steps.project_version.outputs.version }}
